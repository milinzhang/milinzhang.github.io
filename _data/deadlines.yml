# Conference deadlines I track.
#
# registration_deadline_utc / submission_deadline_utc: ISO-8601 UTC instant, used to
#   compute the countdown and sort order. Leave blank ("") if not applicable/not yet released.
# registration_display / submission_display: human-readable string shown in the table
#   (include the timezone the CFP actually states, e.g. AoE, EDT — EDAS/committees are
#   not consistent; "(assumed)" means the CFP didn't state a timezone and AoE was assumed).
# tags: area codes used by the filter buttons on the page (AIML, Wireless, Security).
#
# When a conference's next edition hasn't announced a CFP yet, the entry is named after
# the most recent edition with *real* dates (so the label always matches the data shown).
#
# Update this file as new CFPs are released or dates slip.

